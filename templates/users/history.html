<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat History</title>

    <script src="https://cdn.tailwindcss.com"></script>

    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">

</head>

<body class="bg-black text-white min-h-screen p-4 sm:p-6 lg:p-10">

<div class="max-w-6xl mx-auto">

    <!-- TITLE -->
    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-cyan-400 mb-6 sm:mb-10">
        AI Chat History
    </h1>

    {% if chats %}

        {% for chat in chats %}

        <div class="bg-gray-900 border border-cyan-500 rounded-2xl p-4 sm:p-6 lg:p-6 mb-6 sm:mb-8 shadow-lg">

            <!-- HEADER -->
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">

                <h2 class="text-cyan-400 text-xl sm:text-2xl font-bold">
                    Prompt
                </h2>

                <span class="bg-cyan-500 text-black px-3 py-1 rounded-full text-xs sm:text-sm font-bold w-fit">
                    {{ chat.language }}
                </span>

            </div>

            <!-- PROMPT -->
            <div class="bg-black p-3 sm:p-4 rounded-lg mb-5 border border-gray-700">

                <p class="whitespace-pre-wrap text-gray-300 text-sm sm:text-base">
                    {{ chat.prompt }}
                </p>

            </div>

            <!-- RESPONSE TITLE -->
            <h2 class="text-purple-400 text-xl sm:text-2xl font-bold mb-4">
                AI Response
            </h2>

            <!-- RESPONSE -->
            <div class="bg-black p-3 sm:p-4 rounded-lg border border-gray-700 overflow-x-auto">

                <div class="whitespace-pre-wrap text-gray-300 text-sm sm:text-base">
                    {{ chat.response|safe }}
                </div>

            </div>

            <!-- ACTION -->
            <div class="mt-4 sm:mt-5">

               <a href="/favorite/{{ chat.id }}/"
                  class="inline-flex items-center justify-center
                         bg-yellow-500 hover:bg-yellow-600
                         transition px-4 sm:px-5 py-2 rounded-xl
                         text-black font-bold text-sm sm:text-base">

                    ⭐ Add to Favorite

                </a>

            </div>

            <!-- TIME -->
            <p class="text-gray-500 text-xs sm:text-sm mt-4 sm:mt-5">

                {{ chat.created_at }}

            </p>

        </div>

        {% endfor %}

    {% else %}

        <div class="bg-gray-900 p-6 sm:p-8 rounded-xl border border-cyan-500">

            <p class="text-gray-400 text-sm sm:text-lg">
                No chat history found.
            </p>

        </div>

    {% endif %}

</div>

</body>

</html>
