<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    {% load static %}

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="icon"
        type="image/x-icon"
        href="{% static 'images/favicon.ico' %}"
    >

    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>

<body class="min-h-screen bg-black text-white overflow-x-hidden relative">

    <!-- Background Glow -->
    <div class="fixed inset-0 -z-10">
        <div
            class="absolute top-0 left-0 w-56 h-56 sm:w-72 sm:h-72 bg-cyan-500/20 blur-[100px] sm:blur-[120px] rounded-full"
        ></div>

        <div
            class="absolute bottom-0 right-0 w-56 h-56 sm:w-72 sm:h-72 bg-purple-500/20 blur-[100px] sm:blur-[120px] rounded-full"
        ></div>
    </div>

    <!-- Main -->
    <div class="min-h-screen flex items-center justify-center px-4 py-8">

        <div
            class="w-full max-w-md bg-gray-900/70 backdrop-blur-xl border border-cyan-500/20 rounded-2xl sm:rounded-3xl p-6 sm:p-8 md:p-10 shadow-2xl"
        >

            <!-- Heading -->
            <h1
                class="text-3xl sm:text-4xl font-black text-center mb-2 bg-gradient-to-r from-cyan-400 to-purple-500 text-transparent bg-clip-text"
            >
                Login
            </h1>

            <p class="text-gray-400 text-center text-sm sm:text-base mb-6 sm:mb-8">
                Access your CampusCoder AI account
            </p>

            <!-- Form -->
            <form method="POST" id="loginForm">

                {% csrf_token %}

                <!-- Username -->
                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                    class="w-full p-3 sm:p-4 mb-4 bg-black rounded-xl border border-cyan-500/30 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition"
                >

                <!-- Password -->
                <div class="relative mb-6">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Password"
                        required
                        class="w-full p-3 sm:p-4 pr-12 bg-black rounded-xl border border-cyan-500/30 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition"
                    >

                    <button
                        type="button"
                        onclick="togglePassword()"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition"
                    >
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full py-3 sm:py-4 font-bold text-white uppercase tracking-wide bg-gradient-to-r from-fuchsia-600 to-purple-700 border border-fuchsia-400 rounded-xl shadow-[0_0_15px_rgba(217,70,239,0.8)] hover:scale-[1.02] hover:shadow-[0_0_25px_rgba(217,70,239,1)] transition duration-300 flex items-center justify-center gap-2"
                >

                    <span id="btnText">
                        Login
                    </span>

                    <!-- Loader -->
                    <svg
                        id="loader"
                        class="hidden animate-spin h-5 w-5 text-white"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                    >
                        <circle
                            class="opacity-25"
                            cx="12"
                            cy="12"
                            r="10"
                            stroke="currentColor"
                            stroke-width="4"
                        ></circle>

                        <path
                            class="opacity-75"
                            fill="currentColor"
                            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                        ></path>
                    </svg>

                </button>

            </form>

            <!-- Register Link -->
            <div class="text-center mt-6">
                <p class="text-gray-400 text-sm sm:text-base">
                    Don't have an account?

                    <a
                        href="{% url 'register' %}"
                        class="text-purple-400 font-bold hover:text-fuchsia-300 transition"
                    >
                        Create Account
                    </a>
                </p>
            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script>

        function togglePassword() {

            const password = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {

                password.type = "text";

                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }

        document
            .getElementById("loginForm")
            .addEventListener("submit", function () {

                document
                    .getElementById("loader")
                    .classList.remove("hidden");

                document
                    .getElementById("btnText")
                    .textContent = "Logging in...";

                document
                    .getElementById("submitBtn")
                    .disabled = true;
            });

    </script>

</body>
</html>
