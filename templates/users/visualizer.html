<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algorithm Visualizer</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>

{% load static %}
<link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">

</head>

<body class="bg-black text-white min-h-screen p-4 sm:p-6 lg:p-10">

<div class="max-w-7xl mx-auto">

  <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-cyan-400 mb-8">
    Algorithm Visualizer
  </h1>

  <!-- CONTROL -->
  <div class="bg-gray-900 p-6 rounded-2xl mb-8">

     <label class="text-gray-300">Choose Algorithm</label>

     <select id="algorithm"
        class="w-full mt-3 p-4 rounded-xl bg-black border border-cyan-500">

        <option>Bubble Sort</option>
        <option>Selection Sort</option>
        <option>Binary Search</option>
        <option>Merge Sort</option>

     </select>

     <button onclick="visualize()"
        class="mt-6 bg-cyan-500 hover:bg-cyan-600 px-8 py-4 rounded-xl">

        Visualize

     </button>

  </div>

  <!-- MAIN -->
  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- STEPS -->
    <div class="bg-gray-900 p-6 rounded-2xl border border-cyan-500/20">

        <h2 class="text-xl font-bold text-cyan-400 mb-4">Steps</h2>

        <div id="stepInfo" class="text-sm text-gray-300">
            Waiting...
        </div>

    </div>

    <!-- VISUAL -->
    <div class="lg:col-span-3 bg-gray-900 p-6 rounded-2xl border border-cyan-500/20">

        <div id="visualArea"
            class="h-[400px] flex items-end justify-center gap-3">

        </div>

        <div class="grid grid-cols-3 gap-4 mt-6 text-sm">

            <div class="bg-black p-3 rounded-xl">
                Comparisons: <span id="comparison">0</span>
            </div>

            <div class="bg-black p-3 rounded-xl">
                Swaps: <span id="swaps">0</span>
            </div>

            <div class="bg-black p-3 rounded-xl">
                Status: <span id="status">Ready</span>
            </div>

        </div>

    </div>

  </div>

</div>

<script>

async function visualize(){

  let arr=[50,120,80,150,60,100,40];

  let visualArea=document.getElementById("visualArea");
  let comparison=0;
  let swaps=0;

  document.getElementById("status").innerText="Running";

  function sleep(ms){
    return new Promise(res=>setTimeout(res,ms));
  }

  function renderBars(array, active=[]){

    visualArea.innerHTML="";

    array.forEach((val,i)=>{

      let color = active.includes(i)
        ? "bg-red-500 shadow-red-500/70"
        : "bg-cyan-400";

      let div=document.createElement("div");
      div.className="flex flex-col items-center";

      div.innerHTML=`
        <div class="text-xs text-cyan-300 mb-2">${val}</div>
        <div class="${color} w-10 rounded-t-lg transition-all"
        style="height:${val*2}px"></div>
      `;

      visualArea.appendChild(div);

    });

  }

  renderBars(arr);

  for(let i=0;i<arr.length;i++){

    for(let j=0;j<arr.length-i-1;j++){

      comparison++;
      document.getElementById("comparison").innerText=comparison;

      // STEP 1: highlight compare
      renderBars(arr,[j,j+1]);

      document.getElementById("stepInfo").innerHTML=
        `Comparing ${arr[j]} and ${arr[j+1]}`;

      await sleep(800); 

      // STEP 2: swap if needed
      if(arr[j] > arr[j+1]){

        swaps++;
        document.getElementById("swaps").innerText=swaps;

        [arr[j],arr[j+1]]=[arr[j+1],arr[j]];

        renderBars(arr,[j,j+1]);

        await sleep(800); 

      }

      // STEP 3: reset view
      renderBars(arr);

      await sleep(300);

    }

  }

  document.getElementById("status").innerText="Completed";

}

</script>

</body>

</html>
