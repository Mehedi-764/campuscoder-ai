

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <!-- Main Card -->
        <div class="glass rounded-3xl p-8 sm:p-10 shadow-2xl border border-cyan-500/20 backdrop-blur-xl relative overflow-hidden">
            <!-- Decorative Subtle Glow -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <!-- Header Section -->
            <div class="text-center mb-8">
                <!-- Icon Badge -->
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 mb-5 shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-cyan-400 tracking-tight mb-2">
                    Verify OTP
                </h1>
                <p class="text-sm text-slate-400 leading-relaxed">
                    Enter the 6-digit verification code sent to your university email address.
                </p>
            </div>

            <!-- Form -->
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-widest mb-2 ml-1">
                        Verification Code
                    </label>
                    <input
                        type="text"
                        name="otp"
                        maxlength="6"
                        placeholder="••••••"
                        class="w-full px-5 py-4 rounded-2xl bg-[#0b1329]/80 border border-cyan-500/30 text-white placeholder-slate-500 text-center tracking-[0.5em] text-xl font-bold focus:outline-none focus:border-cyan-400 focus:ring-4 focus:ring-cyan-500/20 transition-all duration-300"
                        required
                        autocomplete="off"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white py-4 rounded-2xl font-bold text-base shadow-lg shadow-cyan-500/25 hover:shadow-cyan-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200"
                >
                    Verify OTP
                </button>
            </form>

            <!-- Extra Footer Note (Optional Visual Polish) -->
            <div class="mt-6 text-center text-xs text-slate-500">
                Didn't receive code? <span class="text-cyan-400 hover:underline cursor-pointer">Resend</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
