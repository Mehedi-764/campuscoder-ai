<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Chat History</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white p-10">

<h1 class="text-4xl font-bold mb-8">
    Previous Chats
</h1>

{% for chat in chats %}

<div class="bg-gray-900 p-6 rounded-lg mb-6">

    <h2 class="text-cyan-400 font-bold mb-2">
        Prompt:
    </h2>

    <p class="mb-4">
        {{ chat.prompt }}
    </p>

    <h2 class="text-purple-400 font-bold mb-2">
        Response:
    </h2>

    <pre class="whitespace-pre-wrap">
{{ chat.response }}
    </pre>

</div>

{% endfor %}

</body>
</html>
