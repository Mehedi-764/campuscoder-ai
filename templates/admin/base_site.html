{% extends 'admin/base.html' %}
{% load static %}

{% block title %}
  CampusCoder AI Admin
{% endblock %}

{% block branding %}
  <div style="display:flex;align-items:center;gap:15px;">
    <img src="{% static 'images/logo.png' %}" style="width:55px;height:55px;object-fit:contain;" />

    <h1 style="font-size:28px;font-weight:800;color:#22d3ee;">CampusCoder AI Admin</h1>
  </div>
{% endblock %}

{% block extrastyle %}
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --panel-2: #0f172a;
      --accent: #22d3ee;
      --accent-hover: #06b6d4;
      --text: #e5e7eb;
    }
    
    body {
      background: var(--bg) !important;
      color: var(--text) !important;
      font-family: 'Inter', sans-serif;
    }
    
    /* HEADER */
    #header {
      background: linear-gradient(90deg, #0f172a, #111827) !important;
      border-bottom: 1px solid rgba(34, 211, 238, 0.3);
      padding: 12px 20px;
    }
    
    /* BRAND */
    #branding h1 {
      color: var(--accent) !important;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    
    /* MODULE BOX */
    .module {
      background: var(--panel) !important;
      border-radius: 12px;
      border: 1px solid rgba(34, 211, 238, 0.1);
      overflow: hidden;
    }
    
    .module h2,
    .module caption {
      background: var(--panel-2) !important;
      color: var(--accent) !important;
      font-weight: 600;
      padding: 10px;
    }
    
    /* SIDEBAR */
    #nav-sidebar {
      background: var(--panel-2) !important;
      border-right: 1px solid rgba(34, 211, 238, 0.1);
    }
    
    #nav-sidebar a {
      color: #93c5fd !important;
    }
    
    #nav-sidebar a:hover {
      color: var(--accent) !important;
    }
    
    /* BUTTONS */
    .button,
    input[type='submit'],
    input[type='button'],
    .submit-row input {
      background: linear-gradient(135deg, #06b6d4, #3b82f6) !important;
      border: none !important;
      border-radius: 10px !important;
      padding: 8px 14px;
      font-weight: 600;
      color: white !important;
      box-shadow: 0 4px 12px rgba(34, 211, 238, 0.2);
      transition: 0.3s ease;
    }
    
    .button:hover,
    input[type='submit']:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(34, 211, 238, 0.35);
      background: linear-gradient(135deg, #0891b2, #2563eb) !important;
    }
    
    /* LINKS */
    a {
      color: var(--accent) !important;
    }
    
    a:hover {
      color: #67e8f9 !important;
    }
    
    /* BREADCRUMBS */
    div.breadcrumbs {
      background: var(--panel-2) !important;
      color: #94a3b8 !important;
      border-bottom: 1px solid rgba(34, 211, 238, 0.1);
    }
    
    /* CONTENT WIDTH FIX */
    .dashboard #content {
      width: 70% !important;
    }
  </style>
{% endblock %}
