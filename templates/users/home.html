<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusCoder AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-blue-900 to-black text-white">

<div class="flex flex-col items-center justify-center min-h-screen">

    <h1 class="text-6xl font-extrabold mb-6
        bg-gradient-to-r from-fuchsia-400 to-cyan-400
        text-transparent bg-clip-text">
           CampusCoder AI
    </h1>

    <p class="text-gray-300 mb-8 text-lg">
        AI Coding Helper for Programming Students
    </p>

    <div class="space-x-4">

        <a href="/login/"
           class="relative inline-block px-8 py-3 font-bold text-white uppercase tracking-wide
           bg-gradient-to-r from-fuchsia-600 to-purple-700
           border-2 border-fuchsia-400
           rounded-md
           shadow-[0_0_15px_rgba(217,70,239,0.8)]
           hover:scale-105
           hover:shadow-[0_0_25px_rgba(217,70,239,1)]
           transition duration-300">

            Login

        </a>

        <a href="/register/"
           class="relative inline-block px-8 py-3 font-bold text-white uppercase tracking-wide
           bg-gradient-to-r from-cyan-500 to-blue-700
           border-2 border-cyan-300
           rounded-md
           shadow-[0_0_15px_rgba(34,211,238,0.8)]
           hover:scale-105
           hover:shadow-[0_0_25px_rgba(34,211,238,1)]
           transition duration-300">

            Register

        </a>

    </div>

</div>

</body>
</html>
