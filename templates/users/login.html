<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <title>Login | CampusCoder AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="min-h-screen bg-[#07090e] text-slate-100 flex items-center justify-center relative overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <!-- Ambient Glowing Background Grid -->
    <div class="fixed inset-0 pointer-events-none -z-10">
        <div class="absolute -top-24 -right-24 w-96 h-96 bg-cyan-500/15 rounded-full blur-[140px]"></div>
        <div class="absolute top-1/2 -left-24 w-96 h-96 bg-purple-600/20 rounded-full blur-[140px]"></div>
        <div class="absolute -bottom-24 right-1/3 w-80 h-80 bg-fuchsia-600/15 rounded-full blur-[120px]"></div>
    </div>

    <!-- Main Card Container -->
    <div class="w-full max-w-md px-4 py-8">
        <div class="bg-[#0f1523]/80 backdrop-blur-2xl border border-slate-800 hover:border-purple-500/30 rounded-3xl p-8 sm:p-10 shadow-[0_20px_50px_rgba(0,0,0,0.5)] transition-all duration-500 relative overflow-hidden group">
            
            <!-- Top Subtle Glow Effect -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent opacity-50 group-hover:opacity-100 transition duration-500"></div>

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-purple-500/10 border border-purple-500/20 text-purple-400 mb-4 shadow-inner">
                    <i class="fa-solid fa-right-to-bracket text-xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight mb-2">
                    Welcome Back
                </h1>
                <p class="text-xs sm:text-sm text-slate-400">
                    Access your <span class="text-purple-400 font-semibold">CampusCoder AI</span> account
                </p>
            </div>

            <!-- Form -->
            <form method="POST" id="loginForm" class="space-y-5">
                {% csrf_token %}

                <!-- Username Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <input
                            type="text"
                            name="username"
                            placeholder="Enter your username"
                            required
                            class="w-full px-4 py-3.5 pl-11 bg-[#090d16] border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 transition duration-200"
                        >
                        <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="••••••••"
                            required
                            class="w-full px-4 py-3.5 pl-11 pr-11 bg-[#090d16] border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 transition duration-200"
                        >
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-purple-400 transition duration-200"
                        >
                            <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full mt-2 py-4 px-6 font-bold text-sm text-white uppercase tracking-wider bg-gradient-to-r from-fuchsia-600 to-purple-700 hover:from-fuchsia-500 hover:to-purple-600 rounded-xl shadow-lg shadow-fuchsia-600/20 hover:shadow-fuchsia-600/35 active:scale-[0.99] transition duration-200 flex items-center justify-center gap-2"
                >
                    <span id="btnText">Login</span>
                    <svg
                        id="loader"
                        class="hidden animate-spin h-5 w-5 text-white"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                    >
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                    </svg>
                </button>
            </form>

            <!-- Register Link -->
            <div class="text-center mt-6 pt-6 border-t border-slate-800/60">
                <p class="text-slate-400 text-sm">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="text-purple-400 font-bold hover:text-purple-300 hover:underline ml-1 transition duration-200">
                        Create Account
                    </a>
                </p>
            </div>

        </div>
    </div>

    <!-- JavaScript Execution -->
    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                password.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }

        document.getElementById("loginForm").addEventListener("submit", function () {
            document.getElementById("loader").classList.remove("hidden");
            document.getElementById("btnText").textContent = "Logging in...";
            document.getElementById("submitBtn").disabled = true;
        });
    </script>

</body>
</html>
