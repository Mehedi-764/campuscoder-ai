<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Algorithm Visualizer | CampusCoder AI</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />

  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>

<body class="bg-[#07090e] text-slate-100 min-h-screen p-4 sm:p-6 lg:p-10 selection:bg-indigo-500 selection:text-white">

<div class="max-w-7xl mx-auto space-y-6">

  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800/80 pb-5">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
          <i class="ri-cpu-line mr-1"></i> Interactive Execution Engine
        </span>
        <span class="text-xs text-slate-500 font-mono">v1.3.0</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 tracking-tight">
        Algorithm Visualizer
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-0.5">
        Simulate sorting algorithms and step-by-step array operations in real time.
      </p>
    </div>
  </div>

  <!-- INTERACTIVE CONTROL TOOLBAR -->
  <div class="bg-[#0e131f] border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
      
      <!-- Algorithm Selector -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
          Algorithm
        </label>
        <div class="relative">
          <select id="algorithm"
            class="w-full px-4 py-2.5 bg-[#090d16] border border-slate-800 rounded-lg text-sm font-medium text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition appearance-none cursor-pointer">
            <option>Bubble Sort</option>
            <option>Selection Sort</option>
            <option>Binary Search</option>
            <option>Merge Sort</option>
          </select>
          <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
            <i class="ri-arrow-down-s-line text-lg"></i>
          </div>
        </div>
      </div>

      <!-- Speed Slider -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
            Speed
          </label>
          <span id="speedValue" class="text-xs font-mono text-indigo-400">800ms</span>
        </div>
        <input type="range" id="speedSlider" min="100" max="1500" value="800" step="100"
          oninput="document.getElementById('speedValue').innerText = this.value + 'ms'"
          class="w-full accent-indigo-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
      </div>

      <!-- Array Size Control -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
            Array Size
          </label>
          <span id="sizeValue" class="text-xs font-mono text-indigo-400">7 items</span>
        </div>
        <input type="range" id="sizeSlider" min="5" max="15" value="7"
          oninput="document.getElementById('sizeValue').innerText = this.value + ' items'"
          class="w-full accent-indigo-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button onclick="visualize()"
          class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-lg text-sm shadow-sm hover:shadow-indigo-500/20 active:scale-[0.98] transition duration-150 flex items-center justify-center gap-1.5">
          <i class="ri-play-fill text-lg"></i>
          <span>Run</span>
        </button>

        <button type="button" onclick="generateNewArray()" title="Generate Random Array"
          class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 py-2.5 px-3 rounded-lg text-sm active:scale-[0.98] transition duration-150">
          <i class="ri-refresh-line text-base"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- MAIN WORKSPACE GRID -->
  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- STEPS LOG PANEL -->
    <div class="bg-[#0e131f] border border-slate-800 rounded-xl p-5 flex flex-col justify-between shadow-lg">
      <div>
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3 mb-4">
          <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="ri-terminal-line text-indigo-400"></i> Trace Log
          </h2>
          <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
        </div>

        <div id="stepInfo" class="text-xs text-slate-300 font-mono bg-[#090d16] border border-slate-800/80 rounded-lg p-3 min-h-[140px] max-h-[220px] overflow-y-auto leading-relaxed">
          Waiting for execution...
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-slate-800/60">
        <p class="text-[11px] text-slate-500 font-mono">Real-time array operations will stream here.</p>
      </div>
    </div>

    <!-- VISUAL CANVAS & METRICS -->
    <div class="lg:col-span-3 bg-[#0e131f] border border-slate-800 rounded-xl p-5 lg:p-6 shadow-lg flex flex-col justify-between">
      
      <!-- Visual Display Area -->
      <div class="bg-[#090d16] border border-slate-800/80 rounded-lg p-6 mb-6">
        <div id="visualArea"
          class="h-[320px] flex items-end justify-center gap-3 sm:gap-4 overflow-x-auto">
        </div>
      </div>

      <!-- Live Indicators & Stats -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">

        <div class="bg-[#090d16] border border-slate-800/80 p-3.5 rounded-lg flex items-center justify-between">
          <span class="text-slate-400 font-medium">Comparisons</span>
          <span id="comparison" class="font-mono font-bold text-indigo-400 text-sm">0</span>
        </div>

        <div class="bg-[#090d16] border border-slate-800/80 p-3.5 rounded-lg flex items-center justify-between">
          <span class="text-slate-400 font-medium">Swaps</span>
          <span id="swaps" class="font-mono font-bold text-amber-400 text-sm">0</span>
        </div>

        <div class="bg-[#090d16] border border-slate-800/80 p-3.5 rounded-lg flex items-center justify-between">
          <span class="text-slate-400 font-medium">Status</span>
          <span id="status" class="font-mono font-bold text-emerald-400 text-xs uppercase tracking-wider">Ready</span>
        </div>

      </div>

    </div>

  </div>

</div>

<!-- JavaScript execution -->
<script>
let currentArr = [50, 120, 80, 150, 60, 100, 40];

function generateNewArray() {
  const size = parseInt(document.getElementById("sizeSlider").value) || 7;
  currentArr = Array.from({length: size}, () => Math.floor(Math.random() * 120) + 30);
  
  let visualArea = document.getElementById("visualArea");
  visualArea.innerHTML = "";
  
  currentArr.forEach((val) => {
    let div = document.createElement("div");
    div.className = "flex flex-col items-center group";
    div.innerHTML = `
      <div class="text-[11px] font-mono text-slate-400 mb-2">${val}</div>
      <div class="bg-indigo-500 w-8 sm:w-10 rounded-t-md transition-all duration-200 hover:bg-indigo-400"
      style="height:${val * 2}px"></div>
    `;
    visualArea.appendChild(div);
  });
  
  document.getElementById("stepInfo").innerText = "New random array generated.";
  document.getElementById("status").innerText = "Ready";
  document.getElementById("comparison").innerText = "0";
  document.getElementById("swaps").innerText = "0";
}

async function visualize(){

  let arr = [...currentArr];
  let visualArea = document.getElementById("visualArea");
  let comparison = 0;
  let swaps = 0;

  document.getElementById("status").innerText = "Running";

  function sleep(){
    let delay = parseInt(document.getElementById("speedSlider").value) || 800;
    return new Promise(res => setTimeout(res, delay));
  }

  function renderBars(array, active=[]){

    visualArea.innerHTML = "";

    array.forEach((val, i) => {

      let color = active.includes(i)
        ? "bg-rose-500 shadow-[0_0_12px_rgba(244,63,94,0.4)] scale-105"
        : "bg-indigo-500";

      let div = document.createElement("div");
      div.className = "flex flex-col items-center group transition-transform duration-150";

      div.innerHTML = `
        <div class="text-[11px] font-mono ${active.includes(i) ? 'text-rose-400 font-bold' : 'text-slate-400'} mb-2">${val}</div>
        <div class="${color} w-8 sm:w-10 rounded-t-md transition-all duration-200"
        style="height:${val * 2}px"></div>
      `;

      visualArea.appendChild(div);

    });

  }

  renderBars(arr);

  for(let i = 0; i < arr.length; i++){

    for(let j = 0; j < arr.length - i - 1; j++){

      comparison++;
      document.getElementById("comparison").innerText = comparison;

      // STEP 1: highlight compare
      renderBars(arr, [j, j+1]);

      let logText = `Comparing <span class="text-rose-400 font-bold">${arr[j]}</span> and <span class="text-rose-400 font-bold">${arr[j+1]}</span>`;
      document.getElementById("stepInfo").innerHTML = logText;

      await sleep(); 

      // STEP 2: swap if needed
      if(arr[j] > arr[j+1]){

        swaps++;
        document.getElementById("swaps").innerText = swaps;

        [arr[j], arr[j+1]] = [arr[j+1], arr[j]];

        renderBars(arr, [j, j+1]);

        await sleep(); 

      }

      // STEP 3: reset view
      renderBars(arr);

      await sleep();

    }

  }

  document.getElementById("status").innerText = "Completed";
  document.getElementById("stepInfo").innerHTML = `<span class="text-emerald-400 font-bold">Sorting Completed Successfully!</span>`;
}

// Initial display load
generateNewArray();
</script>

</body>

</html>
