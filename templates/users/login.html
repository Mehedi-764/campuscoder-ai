<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">

        <h2 class="text-3xl font-bold text-center mb-6">
            Student Login
        </h2>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Username"
                   class="w-full p-3 border rounded mb-4"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   class="w-full p-3 border rounded mb-4"
                   required>

            <button type="submit"
                    class="w-full px-8 py-3 font-bold text-white uppercase tracking-wide
                           bg-gradient-to-r from-fuchsia-600 to-purple-700
                           border-2 border-fuchsia-400
                           rounded-md
                           shadow-[0_0_15px_rgba(217,70,239,0.8)]
                           hover:scale-105
                           hover:shadow-[0_0_25px_rgba(217,70,239,1)]
                           transition duration-300">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
